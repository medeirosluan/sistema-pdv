services:
  db:
    image: postgres:16-alpine
    container_name: pdv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: pdv
      POSTGRES_DB: pdv
    ports:
      - "5432:5432"
    volumes:
      - pdv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv -d pdv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdv_pgdata:
